<section id="projects" class="projects section">
  <div class="container">
    <div class="section-header">
      <div class="badge">Portfolio</div>
      <h2 class="section-title">Featured Projects</h2>
      <p class="section-subtitle">Things I've built and shipped</p>
    </div>

    <div class="filter-tabs">
      <button
        *ngFor="let f of filters"
        class="filter-btn"
        [class.active]="activeFilter === f"
        (click)="setFilter(f)">
        {{ f }}
      </button>
    </div>

    <div class="projects-grid">
      <div class="project-card" *ngFor="let p of filteredProjects">
        <div class="project-img-wrap">
          <img [src]="p.image" [alt]="p.title" class="project-img" loading="lazy" />
          <div class="project-overlay" [style.background]="p.color + '22'"></div>
          <span class="project-year">{{ p.year }}</span>
        </div>
        <div class="project-body">
          <div class="project-tags">
            <span class="tag" *ngFor="let tag of p.tags">{{ tag }}</span>
          </div>
          <h3 class="project-title">{{ p.title }}</h3>
          <p class="project-desc">{{ p.description }}</p>
          <div class="project-footer">
            <div class="color-dot" [style.background]="p.color"></div>
            <span class="project-cat">{{ p.category }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
