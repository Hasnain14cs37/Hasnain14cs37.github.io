<section id="skills" class="skills section">
  <div class="container">
    <div class="section-header">
      <div class="badge">Expertise</div>
      <h2 class="section-title">Skills & Technologies</h2>
      <p class="section-subtitle">A snapshot of what I work with every day</p>
    </div>

    <div class="skills-layout">
      <div class="skill-bars">
        <div class="skill-item" *ngFor="let skill of skills">
          <div class="skill-header">
            <span class="skill-name">{{ skill.name }}</span>
            <span class="skill-pct">{{ skill.level }}%</span>
          </div>
          <div class="bar-track">
            <div
              class="bar-fill"
              [style.width]="animated ? skill.level + '%' : '0%'"
              [style.background]="'linear-gradient(90deg, ' + skill.color + ', ' + skill.color + '88)'">
            </div>
          </div>
        </div>
      </div>

      <div class="tools-grid-col">
        <h3 class="tools-heading">Tech Toolbox</h3>
        <div class="tools-grid">
          <div class="tool-card" *ngFor="let tool of tools">
            <span class="tool-icon">{{ tool.icon }}</span>
            <span class="tool-name">{{ tool.name }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
