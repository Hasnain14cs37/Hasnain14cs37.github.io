<section id="contact" class="sec contact">
  <div class="wrap">
    <div appReveal>
      <span class="eyebrow">Contact</span>
      <h2 style="margin-top: 1rem">Have a project in <span class="hl">mind?</span></h2>
      <p>Available for freelance projects and full-time roles. Send an email and I'll reply within a few hours.</p>
      <div class="contact-cta">
        <a [href]="'mailto:' + email" class="btn btn-accent">Let's work together</a>
        <a [href]="whatsapp" target="_blank" rel="noopener" class="btn btn-wa">Chat on WhatsApp</a>
        <a [href]="upwork" target="_blank" rel="noopener" class="btn btn-ghost">Hire on Upwork</a>
      </div>
      <div class="socials">
        <a *ngFor="let s of socials" [href]="s.href" target="_blank" rel="noopener">{{ s.label }} ↗</a>
      </div>
    </div>
  </div>
</section>
