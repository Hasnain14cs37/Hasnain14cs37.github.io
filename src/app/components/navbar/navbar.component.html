<div class="scroll-progress" [style.width.%]="progress"></div>
<nav class="navbar" [class.scrolled]="scrolled" [class.menu-open]="menuOpen">
  <div class="nav-container">
    <a class="logo" href="#hero" (click)="scrollTo('#hero', $event)">
      <span class="badge-dot"></span> Muhammad Hasnain
    </a>

    <ul class="nav-links" [class.open]="menuOpen">
      <li *ngFor="let link of navLinks">
        <a [href]="link.href" (click)="scrollTo(link.href, $event)" [class.active]="activeSection === link.href">{{ link.label }}</a>
      </li>
    </ul>

    <a [href]="'mailto:' + email" class="btn btn-accent hire">Hire me</a>

    <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
