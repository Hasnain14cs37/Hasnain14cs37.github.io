<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7f56a"/>
      <stop offset="0.55" stop-color="#c6f24e"/>
      <stop offset="1" stop-color="#a8e02f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3a5410" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- squircle base -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#bg)"/>
  <!-- glassy top sheen -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#sheen)"/>
  <!-- premium inner hairline -->
  <rect x="7" y="7" width="498" height="498" rx="114" ry="114" fill="none" stroke="#0a0a0c" stroke-opacity="0.14" stroke-width="4"/>

  <!-- MH monogram (dark ink on lime) -->
  <g fill="none" stroke="#0a0a0c" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#lift)">
    <path d="M110 356 L110 156 L180 258 L250 156 L250 356"/>
    <path d="M312 156 L312 356 M312 256 L402 256 M402 156 L402 356"/>
  </g>
</svg>
